<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="愛犬ノート">
<meta name="theme-color" content="#e8833a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>愛犬ノート</title>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#fbf7f2; --card:#fff; --text:#3b3028; --muted:#8a7b6e; --line:#eadfd3;
  --pri:#e8833a; --pri-d:#c96a26; --pri-l:#fdeede; --ok:#2f9e8f; --warn:#e0a21b; --err:#d64545;
  --chart1:#e8833a; --chart2:#2f9e8f; --chart3:#7a6bd1; --chart4:#b8793f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:16px;line-height:1.5}
body.noscroll{overflow:hidden}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.title{font-size:19px;font-weight:700}
.sync{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#bbb}
.dot.ok{background:var(--ok)} .dot.syncing{background:var(--warn)} .dot.err{background:var(--err)} .dot.pending{background:var(--warn)}
main{padding:12px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
 .cal-h{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--muted);margin-bottom:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd{min-height:104px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px 1px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--text);font-family:inherit}
.cd.has{background:var(--pri-l)} .cd.tdy{outline:2px solid var(--pri);outline-offset:-1px}
.cd .wx{font-size:19px;line-height:1.1}
.cd .tp{font-size:11px;line-height:1.2;font-weight:700;white-space:nowrap;letter-spacing:-.3px}
.cd .tp .h{color:#d6452f} .cd .tp .l{color:#3b6fd6}
.cd .sn{font-size:10px;line-height:1.15;color:var(--muted);white-space:nowrap;letter-spacing:-.4px}
.cd .mk{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--pri)}
.cd{position:relative}
.wxc{display:flex;align-items:center;gap:10px}
.wxc .big{font-size:34px;line-height:1}
.wxs{font-size:12px;color:var(--muted)}
.wxs a{color:var(--muted)}
.plist button{display:block;width:100%;text-align:left;min-height:44px;padding:8px 12px;margin-bottom:6px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px;color:var(--text);font-family:inherit}
.cd.blank{border:none;background:none;pointer-events:none}
.cd .n{font-weight:700;line-height:1.2} .cd.sun .n{color:var(--err)} .cd.sat .n{color:#3b6fd6}
.cd .ic{font-size:10px;line-height:1.2;text-align:center;word-break:break-all;padding:0 1px}
.cd:active{transform:scale(.96)}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.datebar .d{font-size:18px;font-weight:700;text-align:center;flex:1}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:18px;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--pri-l);border-radius:999px;padding:5px 12px;font-size:14px;border:none;font-family:inherit;color:inherit;cursor:pointer}
.chip:active{opacity:.6}
.tl li{border-radius:8px;transition:background .3s}.tl li.flash{background:#fff3d6}.tl li.flashcur{background:#ffdf99}
.chip.s{font-size:12px;padding:2px 9px}
.chip.ok{background:#e0f4f1;color:#1f7a6e} .chip.warn{background:#fdf0cf;color:#8a6208} .chip.mute{background:#f0ebe5;color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:68px;border:1px solid var(--line);background:#fff;border-radius:14px;font-size:12px;color:var(--text)}
.qbtn .i{font-size:24px;line-height:1}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.qhead h3{margin:0}
.qt{min-height:84px;padding-top:8px;touch-action:none;cursor:grab;position:relative;user-select:none;-webkit-user-select:none;border-style:dashed}
.qt.drag{opacity:.85;z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:grabbing}.qt.over{outline:2px dashed var(--pri)}
.qa button{border:none;background:none;font-size:13px;color:var(--muted);padding:4px 8px}
.qbtn:active,.btn:active,.iconbtn:active{transform:scale(.97)}
.btn{min-height:46px;padding:0 18px;border:none;border-radius:12px;background:var(--pri);color:#fff;font-size:16px;font-weight:700}
.btn.sec{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--err);border:1px solid #f0c9c9}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:none}
.tl .t{width:44px;color:var(--muted);font-size:13px;padding-top:2px}
.tl .b{flex:1;min-width:0}
.tl .m{font-size:12px;color:var(--muted);word-break:break-word}
.empty{color:var(--muted);font-size:14px;padding:10px 0;text-align:center}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#efe7de;border:1px solid var(--line);padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.add{display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted);font-size:12px;background:#fff;border-style:dashed}
.ph.add .i{font-size:26px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;border:none;background:none;padding:8px 0 7px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button .i{font-size:22px;line-height:1.1}
.tabs button.on{color:var(--pri-d);font-weight:700}
.seg{display:flex;background:#f0ebe5;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;border-radius:9px;padding:8px 0;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(40,30,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-title{font-size:18px;font-weight:700}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;color:var(--text);font-family:inherit}
.field textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dtf{position:relative;display:block}
.dtv{display:flex;align-items:center;justify-content:space-between;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
.dtv i{font-style:normal;opacity:.6}
.dtf input[type=date]{position:absolute;left:0;top:0;width:100%;height:100%;min-height:0;opacity:0;cursor:pointer;border:none}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 76px 62px 42px;gap:6px;margin-bottom:6px}
.irow .x{min-height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;color:var(--muted)}
.itot{margin:8px 0;font-weight:700;color:var(--pri-d)}
.nrow{display:flex;gap:6px;margin-top:6px}.nrow input{flex:1}
.ochips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ochip{background:var(--pri-l);border-radius:999px;padding:5px 6px 5px 12px;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.ochip button{border:none;background:none;font-size:14px;color:var(--muted);padding:2px 5px}
.opanel{margin:6px 0 4px;padding:8px;border:1px dashed var(--line);border-radius:12px;background:#fff}
.hint{font-size:12px;color:var(--muted)}
.msg{font-size:13px;margin-top:6px;min-height:18px}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.kv span:first-child{color:var(--muted)}
.range{display:flex;gap:8px;margin-bottom:12px}
.range button{flex:1;min-height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:14px;color:var(--muted)}
.range button.on{background:var(--pri-l);border-color:var(--pri);color:var(--pri-d);font-weight:700}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-size:10px;fill:var(--muted)}
.big{font-size:24px;font-weight:700}
.vcard{border-top:1px solid var(--line);padding:12px 0}
.vcard:first-child{border-top:none}
.vhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.vnote{margin-top:6px;font-size:14px;white-space:pre-wrap;word-break:break-word}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(40,30,20,.92);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;z-index:70;max-width:86%;text-align:center;display:none}
.viewer img{width:100%;border-radius:12px;display:block;background:#efe7de;min-height:120px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="title" id="dogTitle">愛犬ノート</div>
    <button class="sync" id="syncBtn" data-act="sync" aria-label="同期"><span class="dot" id="syncDot"></span><span id="syncText">未接続</span></button>
  </header>
  <main id="view"></main>
  <nav class="tabs"><div class="in" id="tabs">
    <button data-tab="cal"><span class="i">🗓️</span>カレンダー</button>
    <button data-tab="today"><span class="i">📝</span>1日</button>
    <button data-tab="graph"><span class="i">📈</span>グラフ</button>
    <button data-tab="med"><span class="i">🏥</span>通院・病気</button>
    <button data-tab="settings"><span class="i">⚙️</span>設定</button>
  </div></nav>
</div>
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head"><div class="sheet-title" id="sheetTitle"></div><button class="iconbtn" data-act="closeSheet" aria-label="閉じる">✕</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<input type="file" id="photoFile" accept="image/*" multiple hidden>
<div id="toast"></div>

<script>
(function () {
'use strict';

/* ================= 基本ユーティリティ ================= */
var $ = function (s) { return document.querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()); }
function hhmm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function nowStr() { var d = new Date(); return ymd(d) + ' ' + hhmm(d) + ':' + pad(d.getSeconds()); }
function parseYmd(s) { var p = s.split('/'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
var WD = ['日', '月', '火', '水', '木', '金', '土'];
function dateLabel(s) { var d = parseYmd(s); return s + '（' + WD[d.getDay()] + '）'; }
function dateField(name, val, required) {
  var v = String(val || '').replace(/\//g, '-'), lab = v ? dateLabel(v.replace(/-/g, '/')) : '（未設定）';
  return '<span class="dtf"><span class="dtv"><span>' + lab + '</span><i>📅</i></span><input type="date" data-dt name="' + name + '" value="' + v + '"' + (required ? ' required' : '') + '></span>';
}
var APP_VER = '2026-11-21 e';
var DEFAULT_OPTS = { meal: ['ごはん', '野菜', 'お肉', 'サプリ', 'フード'], snack: ['お芋', '煮干し', 'ささみ'], peeColor: ['透明', '薄黄色', '黄色', '濃い黄色', '赤っぽい'], peeAmt: ['シート1枚分', 'シート4分の3', 'シート半分', 'シート4分の1'], waterExtra: ['お芋', '野菜', 'サプリ'], walkPace: [], weightWalk: ['散歩した', '散歩しなかった'], medType: [] };
var OPT_LABEL = { meal: '🍚 ごはんの材料', snack: '🦴 おやつ', peeColor: '💦 おしっこの色', peeAmt: '💦 おしっこの量', waterExtra: '🥛 水分にプラスするもの', walkPace: '🐾 散歩のペース', weightWalk: '⚖️ 体重の「散歩の有無」', medType: '💊 お薬の種類' };
var UNITS = ['g', '個', '本', '枚', '粒'], PEE_AMT = ['大', '中', '小', '極小'];
function getOpts(k) { var o = data.profile && data.profile.opts && data.profile.opts[k]; return (o && o.length) ? o.slice() : DEFAULT_OPTS[k].slice(); }
function setOpts(k, list) {
  var o = Object.assign({}, (data.profile && data.profile.opts) || {}); o[k] = list;
  data.profile = Object.assign({}, data.profile, { opts: o }); data.profileAt = nowStr(); dirty.profile.profile = data.profileAt; saveLocal(); scheduleSync();
}
function optChips(k) {
  var l = getOpts(k);
  if (!l.length) return '<div class="hint" style="margin:6px 0">（まだ項目がありません。下の欄から追加してください）</div>';
  return '<div class="ochips">' + l.map(function (o, i) {
    return '<span class="ochip">' + (i > 0 ? '<button type="button" data-act="optMove" data-key="' + k + '" data-i="' + i + '" data-n="-1" aria-label="前へ">◀</button>' : '') + '<span>' + esc(o) + '</span>' + (i < l.length - 1 ? '<button type="button" data-act="optMove" data-key="' + k + '" data-i="' + i + '" data-n="1" aria-label="後ろへ">▶</button>' : '') +
      '<button type="button" data-act="optRen" data-key="' + k + '" data-i="' + i + '" aria-label="' + esc(o) + 'の名前を変える">✎</button><button type="button" data-act="optDel" data-key="' + k + '" data-i="' + i + '" aria-label="' + esc(o) + 'を消す">✕</button></span>';
  }).join('') + '</div>';
}
function optToggle(k) { return '<button type="button" class="btn sec" style="min-height:36px;padding:4px 12px;margin-top:6px" data-act="optPanel" data-key="' + k + '">✎ リストを編集（削除・並べ替え）</button><div class="opanel" data-key="' + k + '" hidden></div>'; }
function optDone(el, key) {
  var fm = el.closest('form[data-form=entry]'); if (!fm) { render(true); return; }
  var list = getOpts(key);
  fm.querySelectorAll('select[data-optkey="' + key + '"]').forEach(function (sl) {
    var cur = sl.value, blank = sl.options.length && sl.options[0].value === '' ? sl.options[0].textContent : null;
    sl.innerHTML = (blank != null ? '<option value="">' + esc(blank) + '</option>' : '') + list.map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('');
    if (cur && list.indexOf(cur) < 0) { var x = document.createElement('option'); x.textContent = cur; sl.appendChild(x); }
    sl.value = cur;
  });
  var pn = fm.querySelector('.opanel[data-key="' + key + '"]'); if (pn && !pn.hidden) pn.innerHTML = optChips(key);
}
function parseItems(t) {
  if (!t) return null; var out = [], ps = String(t).split('、');
  for (var i = 0; i < ps.length; i++) { var m = /^(.+?)\s+(\d+(?:\.\d+)?)(g|個|本|枚|粒)$/.exec(ps[i]); if (!m) return null; out.push({ n: m[1], a: Number(m[2]), u: m[3] }); }
  return out;
}
function fmtItems(items) { return items.map(function (x) { return x.n + ' ' + x.a + x.u; }).join('、'); }
function sumG(items) { var g = items.filter(function (x) { return x.u === 'g'; }); return g.length ? Math.round(g.reduce(function (s, x) { return s + x.a; }, 0) * 10) / 10 : null; }
function totalText(items) {
  var parts = []; UNITS.forEach(function (u) { var xs = items.filter(function (x) { return x.u === u; }); if (xs.length) parts.push(num(xs.reduce(function (s, x) { return s + x.a; }, 0)) + u); });
  return parts.join(' ＋ ');
}
function itemRow(kind, it) {
  var opts = getOpts(kind); if (it.n && opts.indexOf(it.n) < 0) opts.push(it.n);
  return '<div class="irow"><select name="it_n" data-optkey="' + kind + '">' + opts.map(function (o) { return '<option' + (o === it.n ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>' +
    '<input name="it_a" inputmode="decimal" autocomplete="off" placeholder="量" value="' + (it.a === '' || it.a == null ? '' : esc(it.a)) + '">' +
    '<select name="it_u">' + UNITS.map(function (u) { return '<option' + (u === (it.u || 'g') ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '</select>' +
    '<button type="button" class="x" data-act="itDel" aria-label="この行を消す">✕</button></div>';
}
function itemsEditor(kind, ex, o) {
  o = o || {}; var items = [{ n: '', a: '', u: 'g' }];
  if (ex) { var ps = parseItems(ex.text_value); if (ps) items = ps; else if (!o.optional && (ex.text_value || ex.value != null)) items = [{ n: ex.text_value || KINDS[kind].label, a: ex.value == null ? '' : ex.value, u: 'g' }]; }
  return '<div class="field"><label>' + (o.label || (kind === 'snack' ? 'おやつ（選んで、量を入れる）' : '内容（選んで、量を入れる）')) + '</label><div class="items" data-key="' + kind + '">' + items.map(function (it) { return itemRow(kind, it); }).join('') + '</div>' +
    '<button type="button" class="btn sec" data-act="itAdd" data-key="' + kind + '">＋ 行を追加</button><div class="itot" id="itot" data-l="' + (o.optional ? 'プラス分の合計' : '合計') + '"></div>' +
    '<div class="nrow"><input data-newopt="' + kind + '" placeholder="新しい項目名（例：かぼちゃ）" autocomplete="off"><button type="button" class="btn sec" data-act="optAdd" data-key="' + kind + '">リストに追加</button></div>' + optToggle(kind) + '</div>';
}
function collectItems(form) {
  var items = [], bad = false;
  form.querySelectorAll('.irow').forEach(function (r) {
    var raw = toHalf(r.querySelector('[name=it_a]').value || '').replace(/,/g, '').trim(); if (raw === '') return;
    var a = Number(raw); if (!isFinite(a) || a < 0) { bad = true; return; }
    items.push({ n: r.querySelector('[name=it_n]').value, a: a, u: r.querySelector('[name=it_u]').value });
  });
  return { items: items, bad: bad };
}
function updTotal(form) { var t = $('#itot'); if (!t || !form) return; var c = collectItems(form); var lb = t.getAttribute('data-l') || '合計'; t.textContent = c.items.length ? lb + '　' + totalText(c.items) : lb + '　—'; }
var EMPTY_OK = ['walkPace', 'medType'];
function splitMed(t) { t = String(t || ''); var i = t.lastIndexOf('／'); return i > 0 ? { n: t.slice(0, i), d: t.slice(i + 1) } : { n: t, d: '' }; }

async function fetchAll(table, order) {

    var r = await sb.from(table).select('*').order(order, { ascending: true }).range(from, from + size - 1);
    if (r.error) throw r.error;
    out = out.concat(r.data || []);
    if (!r.data || r.data.length < size) break;
    from += size;
  }
  return out;
}
function pickCols(t, row) { var o = {}; COLS[t].forEach(function (c) { o[c] = row[c] === undefined ? null : row[c]; }); return o; }

async function pushAll() {
  var tnames = Object.keys(TABLES);
  for (var i = 0; i < tnames.length; i++) {
    var t = tnames[i], ids = Object.keys(dirty[t]);
    if (!ids.length) continue;
    var snapshot = {}; ids.forEach(function (id) { snapshot[id] = dirty[t][id]; });
    var rows = ids.map(function (id) { return data[t].find(function (r) { return r.id === id; }); }).filter(Boolean).map(function (r) { return pickCols(t, r); });
    for (var k = 0; k < rows.length; k += 200) {
      var r = await sb.from(TABLES[t]).upsert(rows.slice(k, k + 200), { onConflict: 'id' });
      if (r.error) throw r.error;
    }
    ids.forEach(function (id) { if (dirty[t][id] === snapshot[id]) delete dirty[t][id]; });
  }
  if (Object.keys(dirty.profile).length) {
    var snap = dirty.profile.profile;
    var rp = await sb.from('household').upsert([{ key: 'profile', value: data.profile, updated_at: new Date().toISOString() }], { onConflict: 'key' });
    if (rp.error) throw rp.error;
    if (dirty.profile.profile === snap) delete dirty.profile.profile;
  }
  saveLocal();
}
function mergeRows(t, remote) {
  var local = data[t], map = {}; local.forEach(function (r) { map[r.id] = r; });
  remote.forEach(function (r) {
    var l = map[r.id], isDirty = !!dirty[t][r.id];
    if (!l) { local.push(r); map[r.id] = r; return; }
    if (isDirty) {
      if (r.updated_at && (r.updated_at > (l.updated_at || ''))) { Object.assign(l, r); delete dirty[t][r.id]; }
      return;
    }
    Object.assign(l, r);

}

  var tnames = Object.keys(TABLES);
  for (var i = 0; i < tnames.length; i++) { var t = tnames[i]; mergeRows(t, await fetchAll(TABLES[t], 'id')); }
  var rp = await sb.from('household').select('*').eq('key', 'profile');

var urlCache = {};
async function hydratePhotos() {
  var imgs = Array.prototype.slice.call(document.querySelectorAll('img[data-path]'));
  if (!imgs.length) return;
  var need = []; imgs.forEach(function (im) { var p = im.getAttribute('data-path'); var c = urlCache[p]; if (!c || c.exp < Date.now()) { if (need.indexOf(p) < 0) need.push(p); } });
  if (need.length && sb) {
    try {
      var r = await sb.storage.from(BUCKET).createSignedUrls(need, 3600);
      if (r.error) throw r.error;
      (r.data || []).forEach(function (x) { if (x.signedUrl) urlCache[x.path] = { url: x.signedUrl, exp: Date.now() + 3300 * 1000 }; });
    } catch (e) { toast('⚠ 写真を読み込めません：' + friendly(e)); }
  }
  imgs.forEach(function (im) { var c = urlCache[im.getAttribute('data-path')]; if (c && im.getAttribute('src') !== c.url) im.src = c.url; });
}
function compressImage(file, maxPx, quality) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, maxPx / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      cv.toBlob(function (b) { URL.revokeObjectURL(url); b ? res(b) : rej(new Error('画像を変換できません')); }, 'image/jpeg', quality);
    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('画像を読み込めません')); };
    img.src = url;
  });
}
async function toUploadBlob(file) {
  var b = await compressImage(file, 1600, 0.82);
  if (b.size > 2.9 * 1024 * 1024) b = await compressImage(file, 1280, 0.7);
  if (b.size > 2.9 * 1024 * 1024) throw new Error('写真が大きすぎます');
  return b;
}

  Object.keys(TABLES).forEach(function (t) { data[t].forEach(function (r) { if (r.deleted) out.push({ t: t, r: r, ts: r.updated_at || r.created_at || '' }); }); });
  out.sort(function (a, b) { return a.ts < b.ts ? 1 : a.ts > b.ts ? -1 : 0; });
  return out;
}
function trashTitle(t, r) {
  if (t === 'logs') { var k = KINDS[r.kind] || { icon: '📝', label: r.kind }; var v = r.text_value || (r.value != null && r.value !== '' ? r.value : ''); return k.icon + ' ' + esc(k.label) + (v !== '' ? '：' + esc(String(v).slice(0, 40)) : '') + '　' + esc(String(r.at || '').slice(0, 16)); }
  if (t === 'visits') return '🏥 通院　' + esc(r.visit_date || '') + (r.hospital ? '　' + esc(r.hospital) : '');
  if (t === 'conditions') return '💊 ' + esc(r.name || '');
  return '📷 ' + esc(r.taken_on || '');
}
function trashBody() {
  var items = trashItems();
  if (!items.length) return '<div class="empty">ゴミ箱は空です。</div>';
  var shown = items.slice(0, 100);
  var h = '<div class="hint" style="margin-bottom:8px">取り消したものが新しい順に並びます（最大100件）。ファイル本体は消えていません。</div><ul class="tl">';
  shown.forEach(function (it) {
    var r = it.r, tt = it.t, when = it.ts ? String(it.ts).slice(5, 16) : '';
    var by = r.updated_by ? esc(r.updated_by) + 'さんが取り消し' : '取り消した人：不明';
    var title = trashTitle(tt, r);
    h += '<li><div class="b">' +
      (tt === 'photos' ? '<div class="viewer" style="max-width:160px;margin-bottom:6px"><img data-path="' + esc(r.path) + '" alt="写真"></div>' : '') +
      '<div>' + title + '</div>' +
      '<div class="m">' + TRASH_LABEL[tt] + '・入力：' + esc(r.created_by || '—') + '</div>' +
      '<div class="m">' + by + (when ? '　' + esc(when) : '') + '</div>' +
      '<button class="btn sec" style="min-height:38px;margin-top:6px" data-act="restore" data-t="' + tt + '" data-id="' + esc(r.id) + '">元に戻す</button></div></li>';
  });
  return h + '</ul>' + (items.length > shown.length ? '<div class="hint">ほか ' + (items.length - shown.length) + ' 件</div>' : '');
}
function openTrash() { openSheet('🗑 ゴミ箱', trashBody()); hydratePhotos(); }
function openPhoto(id) {
  var p = data.photos.find(function (x) { return x.id === id; }); if (!p) return;
  openSheet('📷 ' + p.taken_on, '<div class="viewer"><img data-path="' + esc(p.path) + '" alt="写真"></div>' +
    '<form data-form="photo" data-id="' + esc(p.id) + '" style="margin-top:12px">' + field('ひとこと（任意）', '<input name="caption" autocomplete="off" value="' + esc(p.caption) + '">') +
    '<div class="hint" style="margin-bottom:10px">撮影・追加した人：' + esc(p.created_by || '—') + '</div><button class="btn block" type="submit">保存する</button>' +
    '<button class="btn danger block" type="button" style="margin-top:8px" data-act="voidPhoto" data-id="' + esc(p.id) + '">この写真を非表示にする</button></form>');

/* ================= CSV ================= */
function csvCell(v) { var s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function exportCsv(t) {
  var cols = COLS[t], rows = data[t].filter(function (r) { return !r.deleted; });
  var out = [cols.join(',')].concat(rows.map(function (r) { return cols.map(function (c) { return csvCell(r[c]); }).join(','); })).join('\r\n');
  var blob = new Blob(['﻿' + out], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'dog_' + t + '_' + today().replace(/\//g, '') + '.csv'; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

      inp.value = ''; optDone(el, key);

    case 'optAddS': { var ks = el.getAttribute('data-key'), vi = String($('#optQ_' + ks).value || '').trim(); if (!vi) break; var ls = getOpts(ks); if (ls.indexOf(vi) >= 0) { toast('もうリストにあります'); break; } ls.push(vi); setOpts(ks, ls); render(true); toast('追加しました'); break; }
    case 'optRen': { var kr = el.getAttribute('data-key'), ir = +el.getAttribute('data-i'), lr = getOpts(kr), nv = prompt('新しい名前にします（過去の記録は、そのまま残ります）', lr[ir]); nv = String(nv || '').trim(); if (!nv || nv === lr[ir]) break; if (lr.indexOf(nv) >= 0) { toast('同じ名前がもうあります'); break; } lr[ir] = nv; setOpts(kr, lr); optDone(el, kr); toast('名前を変えました'); break; }
    case 'optMove': { var km = el.getAttribute('data-key'), lm = getOpts(km), im = +el.getAttribute('data-i'), jm = im + (+el.getAttribute('data-n')); if (jm < 0 || jm >= lm.length) break; var tm = lm[im]; lm[im] = lm[jm]; lm[jm] = tm; setOpts(km, lm); optDone(el, km); break; }

    case 'qedit': ui.qedit = !ui.qedit; render(true); break;
    case 'qren': {
      var kq = el.getAttribute('data-k'), nq = prompt('「' + DEFLAB[kq] + '」の表示名を変えます（空にすると元の名前にもどります）', KINDS[kq].label);
      if (nq === null) break; nq = String(nq).trim().slice(0, 12);
      var kls = Object.assign({}, (data.profile && data.profile.klabels) || {}); if (nq && nq !== DEFLAB[kq]) kls[kq] = nq; else delete kls[kq];
      data.profile = Object.assign({}, data.profile, { klabels: kls }); data.profileAt = nowStr(); dirty.profile.profile = data.profileAt; saveLocal(); scheduleSync(); render(true); toast(nq ? '名前を変えました' : '元の名前にもどしました'); break; }

    case 'optDel': { var kd = el.getAttribute('data-key'), ld = getOpts(kd); if (ld.length <= 1 && EMPTY_OK.indexOf(kd) < 0) { toast('最後のひとつは消せません'); break; } ld.splice(+el.getAttribute('data-i'), 1); setOpts(kd, ld); optDone(el, kd); break; }
    case 'restore': restoreRow(el.getAttribute('data-t'), id); break;

document.addEventListener('submit', function (e) {
  var f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  var t = f.getAttribute('data-form');
  if (t === 'entry') saveEntry(f);
  else if (t === 'visit') saveVisit(f);
  else if (t === 'cond') saveCond(f);
  else if (t === 'photo') { var p = data.photos.find(function (x) { return x.id === f.getAttribute('data-id'); }); if (p) { p.caption = String(new FormData(f).get('caption') || '').trim(); touch('photos', p); markDirty('photos', p); } closeSheet(); }
  else if (t === 'who') {
    var fd = new FormData(f), nw = String(fd.get('who') || '').trim(), nd = String(fd.get('dog') || '').trim();
    if (!nw) { toast('呼び名を入力してください'); return; }
    who = nw; lsSet(KEY.who, who);
    if (nd !== dogName()) { data.profile = Object.assign({}, data.profile, { dogName: nd }); data.profileAt = nowStr(); dirty.profile.profile = data.profileAt; saveLocal(); scheduleSync(); }
    closeSheet();
  }
});
document.addEventListener('click', function (e) { var t = e.target; if (t && t.matches && t.matches('input[type=date][data-dt]')) { try { t.showPicker(); } catch (x) {} } });

  if (t.matches('input[type=date][data-dt]')) { var sp = t.parentNode.querySelector('.dtv span'); if (sp) sp.textContent = t.value ? dateLabel(t.value.replace(/-/g, '/')) : '（未設定）'; }
  var fm = t.closest('form[data-form=entry]'); if (fm && fm.querySelector('.items')) updTotal(fm);

var qd = null;
function qTarget(x, y) { var els = document.elementsFromPoint(x, y); for (var i = 0; i < els.length; i++) { if (els[i].classList && els[i].classList.contains('qt') && els[i] !== qd.el) return els[i]; } return null; }
document.addEventListener('pointerdown', function (e) { var t = e.target.closest && e.target.closest('.qt'); if (!t || e.target.closest('.qa')) return; qd = { el: t, x: e.clientX, y: e.clientY, on: false, id: e.pointerId, over: null }; });
document.addEventListener('pointermove', function (e) {
  if (!qd) return; var dx = e.clientX - qd.x, dy = e.clientY - qd.y;
  if (!qd.on) { if (Math.abs(dx) + Math.abs(dy) < 8) return; qd.on = true; qd.el.classList.add('drag'); try { qd.el.setPointerCapture(qd.id); } catch (x) {} }
  qd.el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  var tg = qTarget(e.clientX, e.clientY); if (qd.over && qd.over !== tg) qd.over.classList.remove('over'); qd.over = tg; if (tg) tg.classList.add('over');
});
function qEnd(e, commit) {
  if (!qd) return; var q = qd; qd = null;
  if (!q.on) return;
  q.el.classList.remove('drag'); q.el.style.transform = ''; if (q.over) q.over.classList.remove('over');
  if (commit && q.over) { var ks = quickOrder(), a = q.el.getAttribute('data-k'), b = q.over.getAttribute('data-k'); ks.splice(ks.indexOf(a), 1); ks.splice(ks.indexOf(b) + (0), 0, a); setQOrder(ks); render(true); }
}
document.addEventListener('pointerup', function (e) { qEnd(e, true); });
document.addEventListener('pointercancel', function (e) { qEnd(e, false); });
document.addEventListener('input', onFormInput); document.addEventListener('change', onFormInput);
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || !e.target.matches) return;
  if (e.target.matches('[data-newopt]')) { e.preventDefault(); e.target.parentNode.querySelector('[data-act=optAdd]').click(); }
  else if (e.target.matches('[data-newopt-s]')) { e.preventDefault(); e.target.parentNode.querySelector('[data-act=optAddS]').click(); }

document.addEventListener('visibilitychange', function () { if (!document.hidden) { if (ui.date !== today() && false) ui.date = today(); sync(false); } });

setInterval(function () { if (!document.hidden && sb && $('#sheetWrap').hidden) sync(false); }, 60000);

  if (sb) sync(false);
}
window.addEventListener('load', function () { setTimeout(boot, 50); });
window.__dog = { get data() { return data; }, get dirty() { return dirty; }, sync: sync, ui: ui };
})();
