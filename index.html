<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="愛犬ノート">
<meta name="theme-color" content="#e8833a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>愛犬ノート</title>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#fbf7f2; --card:#fff; --text:#3b3028; --muted:#8a7b6e; --line:#eadfd3;
  --pri:#e8833a; --pri-d:#c96a26; --pri-l:#fdeede; --ok:#2f9e8f; --warn:#e0a21b; --err:#d64545;
  --chart1:#e8833a; --chart2:#2f9e8f; --chart3:#7a6bd1; --chart4:#b8793f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:16px;line-height:1.5}
body.noscroll{overflow:hidden}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.title{font-size:19px;font-weight:700}
.sync{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#bbb}
.dot.ok{background:var(--ok)} .dot.syncing{background:var(--warn)} .dot.err{background:var(--err)} .dot.pending{background:var(--warn)}
main{padding:12px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.datebar .d{font-size:18px;font-weight:700;text-align:center;flex:1}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:18px;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--pri-l);border-radius:999px;padding:5px 12px;font-size:14px}
.chip.s{font-size:12px;padding:2px 9px}
.chip.ok{background:#e0f4f1;color:#1f7a6e} .chip.warn{background:#fdf0cf;color:#8a6208} .chip.mute{background:#f0ebe5;color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:68px;border:1px solid var(--line);background:#fff;border-radius:14px;font-size:12px;color:var(--text)}
.qbtn .i{font-size:24px;line-height:1}
.qbtn:active,.btn:active,.iconbtn:active{transform:scale(.97)}
.btn{min-height:46px;padding:0 18px;border:none;border-radius:12px;background:var(--pri);color:#fff;font-size:16px;font-weight:700}
.btn.sec{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--err);border:1px solid #f0c9c9}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:none}
.tl .t{width:44px;color:var(--muted);font-size:13px;padding-top:2px}
.tl .b{flex:1;min-width:0}
.tl .m{font-size:12px;color:var(--muted);word-break:break-word}
.empty{color:var(--muted);font-size:14px;padding:10px 0;text-align:center}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#efe7de;border:1px solid var(--line);padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.add{display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted);font-size:12px;background:#fff;border-style:dashed}
.ph.add .i{font-size:26px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;border:none;background:none;padding:8px 0 7px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button .i{font-size:22px;line-height:1.1}
.tabs button.on{color:var(--pri-d);font-weight:700}
.seg{display:flex;background:#f0ebe5;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;border-radius:9px;padding:8px 0;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(40,30,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-title{font-size:18px;font-weight:700}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;color:var(--text);font-family:inherit}
.field textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--muted)}
.msg{font-size:13px;margin-top:6px;min-height:18px}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.kv span:first-child{color:var(--muted)}
.range{display:flex;gap:8px;margin-bottom:12px}
.range button{flex:1;min-height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:14px;color:var(--muted)}
.range button.on{background:var(--pri-l);border-color:var(--pri);color:var(--pri-d);font-weight:700}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-size:10px;fill:var(--muted)}
.big{font-size:24px;font-weight:700}
.vcard{border-top:1px solid var(--line);padding:12px 0}
.vcard:first-child{border-top:none}
.vhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.vnote{margin-top:6px;font-size:14px;white-space:pre-wrap;word-break:break-word}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(40,30,20,.92);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;z-index:70;max-width:86%;text-align:center;display:none}
.viewer img{width:100%;border-radius:12px;display:block;background:#efe7de;min-height:120px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="title" id="dogTitle">愛犬ノート</div>
    <button class="sync" id="syncBtn" data-act="sync" aria-label="同期"><span class="dot" id="syncDot"></span><span id="syncText">未接続</span></button>
  </header>
  <main id="view"></main>
  <nav class="tabs"><div class="in" id="tabs">
    <button data-tab="today"><span class="i">📅</span>今日</button>
    <button data-tab="graph"><span class="i">📈</span>グラフ</button>
    <button data-tab="med"><span class="i">🏥</span>通院・病気</button>
    <button data-tab="settings"><span class="i">⚙️</span>設定</button>
  </div></nav>
</div>
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head"><div class="sheet-title" id="sheetTitle"></div><button class="iconbtn" data-act="closeSheet" aria-label="閉じる">✕</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<input type="file" id="photoFile" accept="image/*" multiple hidden>
<div id="toast"></div>

<script>
(function () {
'use strict';

/* ================= 基本ユーティリティ ================= */
var $ = function (s) { return document.querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()); }
function hhmm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function nowStr() { var d = new Date(); return ymd(d) + ' ' + hhmm(d) + ':' + pad(d.getSeconds()); }
function parseYmd(s) { var p = s.split('/'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
var WD = ['日', '月', '火', '水', '木', '金', '土'];
function dateLabel(s) { var d = parseYmd(s); return s + '（' + WD[d.getDay()] + '）'; }
function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function num(n) { return (Math.round(n * 10) / 10).toLocaleString('ja-JP'); }
function yen(n) { return '¥' + Math.round(n || 0).toLocaleString('ja-JP'); }
function toHalf(s) { return String(s).replace(/[０-９．，]/g, function (c) { return c === '．' ? '.' : c === '，' ? ',' : String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }); }
function today() { return ymd(new Date()); }

var toastTimer = null;
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = 'none'; }, 2600);
}

/* ================= データ保持（端末が正本・クラウドは共有用の写し） ================= */
var KEY = { data: 'dogapp_data_v1', dirty: 'dogapp_dirty_v1', cfg: 'dogapp_sync_cfg', who: 'dogapp_who', last: 'dogapp_last_sync' };
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

var TABLES = { logs: 'logs', conditions: 'conditions', visits: 'vet_visits', photos: 'photos' };
var COLS = {
  logs: ['id', 'at', 'kind', 'value', 'text_value', 'memo', 'deleted', 'created_by', 'updated_by', 'created_at', 'updated_at'],
  conditions: ['id', 'name', 'started_on', 'status', 'meds', 'memo', 'deleted', 'created_by', 'updated_by', 'created_at', 'updated_at'],
  visits: ['id', 'visit_date', 'hospital', 'condition_id', 'cost', 'doctor_notes', 'next_visit', 'memo', 'deleted', 'created_by', 'updated_by', 'created_at', 'updated_at'],
  photos: ['id', 'taken_on', 'path', 'caption', 'deleted', 'created_by', 'created_at']
};
function emptyData() { return { logs: [], conditions: [], visits: [], photos: [], profile: { dogName: '' }, profileAt: '' }; }
function emptyDirty() { return { logs: {}, conditions: {}, visits: {}, photos: {}, profile: {} }; }
var data = emptyData(), dirty = emptyDirty();
try { var d0 = JSON.parse(lsGet(KEY.data) || 'null'); if (d0) { data = Object.assign(emptyData(), d0); } } catch (e) {}
try { var q0 = JSON.parse(lsGet(KEY.dirty) || 'null'); if (q0) { dirty = Object.assign(emptyDirty(), q0); } } catch (e) {}
var who = lsGet(KEY.who) || '';
var syncCfg = null; try { syncCfg = JSON.parse(lsGet(KEY.cfg) || 'null'); } catch (e) {}
var lastSync = lsGet(KEY.last) || '';

function saveLocal() {
  var ok = lsSet(KEY.data, JSON.stringify(data)) && lsSet(KEY.dirty, JSON.stringify(dirty));
  if (!ok) toast('⚠ 端末に保存できませんでした（容量不足の可能性）');
}
function markDirty(table, row) {
  dirty[table][row.id] = row.updated_at || row.created_at || nowStr();
  saveLocal(); scheduleSync();
}
function pendingCount() {
  var n = 0; Object.keys(dirty).forEach(function (t) { n += Object.keys(dirty[t]).length; }); return n;
}

/* ================= 画面状態 ================= */
var ui = { tab: 'today', date: today(), range: 30, med: 'visits' };

var KINDS = {
  meal: { label: 'ごはん', icon: '🍚', valueLabel: '量 (g)', textLabel: 'メニュー', suggest: true },
  water: { label: '水分', icon: '🥛', valueLabel: '量 (g)' },
  walk: { label: '散歩', icon: '🐾', valueLabel: '時間 (分)' },
  poop: { label: 'うんち', icon: '💩', valueLabel: '量 (g)', valueOptional: true, textLabel: '状態', options: ['良好', 'やわらかい', '下痢', '硬い', '異常あり'] },
  pee: { label: 'おしっこ', icon: '💦' },
  weight: { label: '体重', icon: '⚖️', valueLabel: '体重 (g)' },
  weather: { label: '天気', icon: '☀️', textLabel: '天気', options: ['晴れ', 'くもり', '雨', '雪'], textRequired: true },
  note: { label: '所見', icon: '📝', textLabel: '今日の様子', textarea: true, textRequired: true }
};
var QUICK = ['meal', 'walk', 'poop', 'pee', 'weight', 'water', 'weather', 'note'];

/* ================= 取得ヘルパー ================= */
function dogName() { return (data.profile && data.profile.dogName) || ''; }
function liveLogs() { return data.logs.filter(function (l) { return !l.deleted; }); }
function dayLogs(d) { return liveLogs().filter(function (l) { return l.at.slice(0, 10) === d; }).sort(function (a, b) { return a.at < b.at ? -1 : a.at > b.at ? 1 : 0; }); }
function sumVal(arr, kind) { return arr.filter(function (l) { return l.kind === kind && l.value != null; }).reduce(function (s, l) { return s + Number(l.value); }, 0); }
function condName(id) { var c = data.conditions.find(function (x) { return x.id === id; }); return c ? c.name : ''; }
function describe(l) {
  var K = KINDS[l.kind] || { label: l.kind, icon: '•' }, parts = [];
  if (l.kind === 'meal') { parts.push(l.text_value || 'ごはん'); if (l.value != null) parts.push(num(l.value) + 'g'); }
  else if (l.kind === 'walk') { parts.push('散歩 ' + num(l.value) + '分'); }
  else if (l.kind === 'poop') { parts.push('うんち'); if (l.value != null) parts.push(num(l.value) + 'g'); if (l.text_value) parts.push('（' + l.text_value + '）'); }
  else if (l.kind === 'pee') { parts.push('おしっこ'); }
  else if (l.kind === 'weight') { parts.push('体重 ' + num(l.value) + 'g'); }
  else if (l.kind === 'water') { parts.push('水分 ' + num(l.value) + 'g'); }
  else if (l.kind === 'weather') { parts.push('天気：' + l.text_value); }
  else if (l.kind === 'note') { parts.push(l.text_value); }
  else { parts.push(K.label); }
  return K.icon + ' ' + parts.join(' ');
}

/* ================= 同期（Supabase） ================= */
var sb = null, syncing = false, syncTimer = null, syncErr = '';
var BUCKET = 'dog-photos';
function connect() {
  sb = null;
  if (!syncCfg || !window.supabase || !window.supabase.createClient) return false;
  try { sb = window.supabase.createClient(syncCfg.url, syncCfg.key, { auth: { persistSession: false, autoRefreshToken: false } }); return true; }
  catch (e) { syncErr = '接続設定が正しくありません'; return false; }
}
function friendly(e) {
  var s = String((e && (e.message || e.error_description || e.code)) || e || '');
  if (/Invalid API key|JWT|apikey/i.test(s) || (e && (e.status === 401 || e.status === 403))) return 'キーが正しくないか、権限がありません';
  if (/Failed to fetch|NetworkError|Load failed/i.test(s)) return 'オフライン、または通信エラーです';
  if (/relation .* does not exist|schema cache|PGRST205|42P01/i.test(s)) return 'テーブルがありません（SQLを実行したか確認）';
  return s.slice(0, 80) || '同期エラー';
}
function setStatus() {
  var dot = $('#syncDot'), tx = $('#syncText');
  var cls = 'dot', text = '';
  if (!syncCfg) { text = '端末のみ'; }
  else if (syncing) { cls += ' syncing'; text = '同期中…'; }
  else if (syncErr) { cls += ' err'; text = '同期エラー'; }
  else if (pendingCount() > 0) { cls += ' pending'; text = '未送信 ' + pendingCount(); }
  else { cls += ' ok'; text = lastSync ? '同期済み ' + lastSync.slice(11, 16) : '接続済み'; }
  dot.className = cls; tx.textContent = text;
}
function scheduleSync() { if (!sb) { setStatus(); return; } clearTimeout(syncTimer); syncTimer = setTimeout(function () { sync(false); }, 700); setStatus(); }

async function fetchAll(table, order) {
  var out = [], from = 0, size = 1000;
  for (;;) {
    var r = await sb.from(table).select('*').order(order, { ascending: true }).range(from, from + size - 1);
    if (r.error) throw r.error;
    out = out.concat(r.data || []);
    if (!r.data || r.data.length < size) break;
    from += size;
  }
  return out;
}
function pickCols(t, row) { var o = {}; COLS[t].forEach(function (c) { o[c] = row[c] === undefined ? null : row[c]; }); return o; }

async function pushAll() {
  var tnames = Object.keys(TABLES);
  for (var i = 0; i < tnames.length; i++) {
    var t = tnames[i], ids = Object.keys(dirty[t]);
    if (!ids.length) continue;
    var snapshot = {}; ids.forEach(function (id) { snapshot[id] = dirty[t][id]; });
    var rows = ids.map(function (id) { return data[t].find(function (r) { return r.id === id; }); }).filter(Boolean).map(function (r) { return pickCols(t, r); });
    for (var k = 0; k < rows.length; k += 200) {
      var r = await sb.from(TABLES[t]).upsert(rows.slice(k, k + 200), { onConflict: 'id' });
      if (r.error) throw r.error;
    }
    ids.forEach(function (id) { if (dirty[t][id] === snapshot[id]) delete dirty[t][id]; });
  }
  if (Object.keys(dirty.profile).length) {
    var snap = dirty.profile.profile;
    var rp = await sb.from('household').upsert([{ key: 'profile', value: data.profile, updated_at: new Date().toISOString() }], { onConflict: 'key' });
    if (rp.error) throw rp.error;
    if (dirty.profile.profile === snap) delete dirty.profile.profile;
  }
  saveLocal();
}
function mergeRows(t, remote) {
  var local = data[t], map = {}; local.forEach(function (r) { map[r.id] = r; });
  remote.forEach(function (r) {
    var l = map[r.id], isDirty = !!dirty[t][r.id];
    if (!l) { local.push(r); map[r.id] = r; return; }
    if (isDirty) {
      if (r.updated_at && (r.updated_at > (l.updated_at || ''))) { Object.assign(l, r); delete dirty[t][r.id]; }
      return;
    }
    Object.assign(l, r);
  });
}
async function pullAll() {
  var tnames = Object.keys(TABLES);
  for (var i = 0; i < tnames.length; i++) { var t = tnames[i]; mergeRows(t, await fetchAll(TABLES[t], 'id')); }
  var rp = await sb.from('household').select('*').eq('key', 'profile');
  if (rp.error) throw rp.error;
  if (rp.data && rp.data[0] && !dirty.profile.profile && rp.data[0].value) { data.profile = Object.assign({ dogName: '' }, rp.data[0].value); }
  saveLocal();
}
async function sync(manual) {
  if (!sb) { if (manual) toast('設定でURLとキーを入力してください'); return; }
  if (syncing) return;
  syncing = true; syncErr = ''; setStatus();
  try {
    await pushAll(); await pullAll();
    lastSync = nowStr(); lsSet(KEY.last, lastSync);
    if (manual) toast('同期しました');
  } catch (e) { syncErr = friendly(e); if (manual) toast('⚠ ' + syncErr); }
  syncing = false; setStatus(); refreshAfterSync();
}
function refreshAfterSync() { if ($('#sheetWrap').hidden) render(true); $('#dogTitle').textContent = dogName() ? dogName() + 'ノート' : '愛犬ノート'; }

/* ================= 写真 ================= */
var urlCache = {};
async function hydratePhotos() {
  var imgs = Array.prototype.slice.call(document.querySelectorAll('img[data-path]'));
  if (!imgs.length) return;
  var need = []; imgs.forEach(function (im) { var p = im.getAttribute('data-path'); var c = urlCache[p]; if (!c || c.exp < Date.now()) { if (need.indexOf(p) < 0) need.push(p); } });
  if (need.length && sb) {
    try {
      var r = await sb.storage.from(BUCKET).createSignedUrls(need, 3600);
      if (r.error) throw r.error;
      (r.data || []).forEach(function (x) { if (x.signedUrl) urlCache[x.path] = { url: x.signedUrl, exp: Date.now() + 3300 * 1000 }; });
    } catch (e) { toast('⚠ 写真を読み込めません：' + friendly(e)); }
  }
  imgs.forEach(function (im) { var c = urlCache[im.getAttribute('data-path')]; if (c && im.getAttribute('src') !== c.url) im.src = c.url; });
}
function compressImage(file, maxPx, quality) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {

  var row = id ? data.logs.find(function (l) { return l.id === id; }) : null;
  if (row) { Object.assign(row, { at: at, value: value, text_value: text, memo: String(f.get('memo') || '').trim(), updated_by: who, updated_at: ts }); }
  else { row = { id: uid('l_'), at: at, kind: kind, value: value, text_value: text, memo: String(f.get('memo') || '').trim(), deleted: false, created_by: who, updated_by: who, created_at: ts, updated_at: ts }; data.logs.push(row); }
  ui.date = at.slice(0, 10); markDirty('logs', row); closeSheet(); toast('記録しました');
}

function openVisit(id) {
  if (!requireWho()) return;
  var ex = id ? data.visits.find(function (v) { return v.id === id; }) : null;
  var conds = liveConds(), b = '<form data-form="visit" data-id="' + esc(id || '') + '">';
  b += '<div class="two">' + field('通院日', '<input type="date" name="visit_date" required value="' + (ex ? ex.visit_date : today()).replace(/\//g, '-') + '">') + field('料金（円）', '<input name="cost" inputmode="numeric" autocomplete="off" value="' + (ex ? esc(ex.cost) : '') + '" placeholder="例：8500">') + '</div>';
  b += field('病院名', '<input name="hospital" autocomplete="off" value="' + esc(ex ? ex.hospital : '') + '">');
  b += field('関連する病気', '<select name="condition_id"><option value="">（なし）</option>' + conds.map(function (c) { return '<option value="' + esc(c.id) + '"' + (ex && ex.condition_id === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select>', conds.length ? '' : '先に「病気・投薬」を登録すると選べます');
  b += field('先生の話', '<textarea name="doctor_notes" placeholder="診断、注意点、薬の説明など">' + esc(ex ? ex.doctor_notes : '') + '</textarea>');
  b += field('次回の予約日（任意）', '<input type="date" name="next_visit" value="' + (ex && ex.next_visit ? ex.next_visit.replace(/\//g, '-') : '') + '">');
  b += field('メモ（任意）', '<input name="memo" autocomplete="off" value="' + esc(ex ? ex.memo : '') + '">');
  b += '<button class="btn block" type="submit">' + (ex ? '更新する' : '記録する') + '</button>';
  if (ex) b += '<button class="btn danger block" type="button" style="margin-top:8px" data-act="voidVisit" data-id="' + esc(ex.id) + '">この記録を取り消す</button>';
  openSheet('🏥 通院記録', b + '</form>');
}
function saveVisit(form) {
  var id = form.getAttribute('data-id'), f = new FormData(form), ts = nowStr();
  var costRaw = toHalf(f.get('cost') || '').replace(/[,¥円\s]/g, ''), cost = costRaw === '' ? 0 : Number(costRaw);
  if (!isFinite(cost) || cost < 0) { toast('料金は数字で入力してください'); return; }
  var vals = { visit_date: String(f.get('visit_date')).replace(/-/g, '/'), hospital: String(f.get('hospital') || '').trim(), condition_id: f.get('condition_id') || null, cost: Math.round(cost), doctor_notes: String(f.get('doctor_notes') || '').trim(), next_visit: String(f.get('next_visit') || '').replace(/-/g, '/'), memo: String(f.get('memo') || '').trim() };
  var row = id ? data.visits.find(function (v) { return v.id === id; }) : null;
  if (row) Object.assign(row, vals, { updated_by: who, updated_at: ts });
  else { row = Object.assign({ id: uid('v_'), deleted: false, created_by: who, updated_by: who, created_at: ts, updated_at: ts }, vals); data.visits.push(row); }
  markDirty('visits', row); closeSheet(); toast('記録しました');
}
function openCond(id) {
  if (!requireWho()) return;
  var ex = id ? data.conditions.find(function (c) { return c.id === id; }) : null, b = '<form data-form="cond" data-id="' + esc(id || '') + '">';
  b += field('病名', '<input name="name" required autocomplete="off" value="' + esc(ex ? ex.name : '') + '">');
  b += '<div class="two">' + field('開始日（任意）', '<input type="date" name="started_on" value="' + (ex && ex.started_on ? ex.started_on.replace(/\//g, '-') : '') + '">') +
    field('状態', '<select name="status">' + ['治療中', '経過観察', '完治'].map(function (s) { return '<option' + (ex && ex.status === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>') + '</div>';
  b += field('薬・投薬', '<textarea name="meds" placeholder="薬の名前、量、回数など">' + esc(ex ? ex.meds : '') + '</textarea>');
  b += field('メモ（任意）', '<input name="memo" autocomplete="off" value="' + esc(ex ? ex.memo : '') + '">');
  b += '<button class="btn block" type="submit">' + (ex ? '更新する' : '登録する') + '</button>';
  if (ex) b += '<button class="btn danger block" type="button" style="margin-top:8px" data-act="voidCond" data-id="' + esc(ex.id) + '">この登録を取り消す</button>';
  openSheet('💊 病気・投薬', b + '</form>');
}
function saveCond(form) {
  var id = form.getAttribute('data-id'), f = new FormData(form), ts = nowStr();
  var vals = { name: String(f.get('name') || '').trim(), started_on: String(f.get('started_on') || '').replace(/-/g, '/'), status: f.get('status') || '治療中', meds: String(f.get('meds') || '').trim(), memo: String(f.get('memo') || '').trim() };
  if (!vals.name) { toast('病名を入力してください'); return; }
  var row = id ? data.conditions.find(function (c) { return c.id === id; }) : null;
  if (row) Object.assign(row, vals, { updated_by: who, updated_at: ts });
  else { row = Object.assign({ id: uid('c_'), deleted: false, created_by: who, updated_by: who, created_at: ts, updated_at: ts }, vals); data.conditions.push(row); }
  markDirty('conditions', row); closeSheet(); toast('登録しました');
}
function voidRow(table, id, msg) {
  if (!confirm(msg)) return;
  var row = data[table].find(function (r) { return r.id === id; }); if (!row) return;
  row.deleted = true; if ('updated_at' in row) { row.updated_at = nowStr(); row.updated_by = who; }
  markDirty(table, row); closeSheet(); toast('取り消しました');
}
function openPhoto(id) {
  var p = data.photos.find(function (x) { return x.id === id; }); if (!p) return;
  openSheet('📷 ' + p.taken_on, '<div class="viewer"><img data-path="' + esc(p.path) + '" alt="写真"></div>' +
    '<form data-form="photo" data-id="' + esc(p.id) + '" style="margin-top:12px">' + field('ひとこと（任意）', '<input name="caption" autocomplete="off" value="' + esc(p.caption) + '">') +
    '<div class="hint" style="margin-bottom:10px">撮影・追加した人：' + esc(p.created_by || '—') + '</div><button class="btn block" type="submit">保存する</button>' +
    '<button class="btn danger block" type="button" style="margin-top:8px" data-act="voidPhoto" data-id="' + esc(p.id) + '">この写真を非表示にする</button></form>');
  hydratePhotos();
}

/* ================= CSV ================= */
function csvCell(v) { var s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function exportCsv(t) {
  var cols = COLS[t], rows = data[t].filter(function (r) { return !r.deleted; });
  var out = [cols.join(',')].concat(rows.map(function (r) { return cols.map(function (c) { return csvCell(r[c]); }).join(','); })).join('\r\n');
  var blob = new Blob(['﻿' + out], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'dog_' + t + '_' + today().replace(/\//g, '') + '.csv'; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ================= イベント ================= */
document.addEventListener('click', function (e) {
  var tabBtn = e.target.closest('#tabs button'); if (tabBtn) { ui.tab = tabBtn.getAttribute('data-tab'); render(false); return; }
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  switch (act) {
    case 'sync': sync(true); break;
    case 'tab': ui.tab = el.getAttribute('data-tab'); render(false); break;
    case 'day': ui.date = addDays(ui.date, +el.getAttribute('data-n')); render(false); break;
    case 'goToday': ui.date = today(); render(false); break;
    case 'range': ui.range = +el.getAttribute('data-n'); render(true); break;
    case 'medTab': ui.med = el.getAttribute('data-t'); render(false); break;
    case 'add': openEntry(el.getAttribute('data-kind')); break;
    case 'edit': { var l = data.logs.find(function (x) { return x.id === id; }); if (l) openEntry(l.kind, id); break; }
    case 'addVisit': openVisit(); break;
    case 'editVisit': openVisit(id); break;
    case 'addCond': openCond(); break;
    case 'editCond': openCond(id); break;
    case 'closeSheet': closeSheet(); break;
    case 'voidLog': voidRow('logs', id, 'この記録を取り消しますか？'); break;
    case 'voidVisit': voidRow('visits', id, 'この通院記録を取り消しますか？'); break;
    case 'voidCond': voidRow('conditions', id, 'この登録を取り消しますか？'); break;
    case 'voidPhoto': voidRow('photos', id, 'この写真を非表示にしますか？'); break;
    case 'addPhoto': if (requireWho()) { if (!sb) toast('写真は、設定でクラウド同期を接続してから使えます'); else $('#photoFile').click(); } break;
    case 'viewPhoto': openPhoto(id); break;
    case 'csv': exportCsv(el.getAttribute('data-t')); break;
    case 'saveBasic': {
      var nd = ($('#setDog').value || '').trim(), nw = ($('#setWho').value || '').trim();
      if (!nw) { toast('入力者名を入れてください'); break; }
      who = nw; lsSet(KEY.who, who);
      if (nd !== dogName()) { data.profile = { dogName: nd }; data.profileAt = nowStr(); dirty.profile.profile = data.profileAt; saveLocal(); scheduleSync(); }
      render(true); toast('保存しました'); break;
    }
    case 'connect': {
      var u = ($('#sbUrl').value || '').trim().replace(/\/+$/, ''), k = ($('#sbKey').value || '').trim(), m = $('#sbMsg');
      if (!/^https:\/\/[^\s\/]+\.[^\s\/]+$/.test(u)) { m.className = 'msg err'; m.textContent = '⚠ Project URL は https://xxxx.supabase.co の形で入力してください'; break; }
      if (k.length < 20) { m.className = 'msg err'; m.textContent = '⚠ anon public key を貼り付けてください'; break; }
      syncCfg = { url: u, key: k }; lsSet(KEY.cfg, JSON.stringify(syncCfg)); syncErr = '';
      if (!connect()) { m.className = 'msg err'; m.textContent = '⚠ 同期ライブラリを読み込めませんでした（オフライン？）'; break; }
      m.className = 'msg ok'; m.textContent = '接続を確認しています…';
      // 初回は、端末の既存記録も送る
      ['logs', 'conditions', 'visits', 'photos'].forEach(function (t) { data[t].forEach(function (r) { dirty[t][r.id] = r.updated_at || r.created_at || nowStr(); }); });
      if (data.profile && data.profile.dogName) dirty.profile.profile = nowStr();
      saveLocal(); sync(true).then(function () { if (ui.tab === 'settings') render(true); }); break;
    }
    case 'disconnect': if (confirm('同期を切断しますか？（端末の記録は残ります）')) { syncCfg = null; sb = null; lsDel(KEY.cfg); syncErr = ''; render(true); } break;
  }
});
document.addEventListener('submit', function (e) {
  var f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  var t = f.getAttribute('data-form');
  if (t === 'entry') saveEntry(f);
  else if (t === 'visit') saveVisit(f);
  else if (t === 'cond') saveCond(f);
  else if (t === 'photo') { var p = data.photos.find(function (x) { return x.id === f.getAttribute('data-id'); }); if (p) { p.caption = String(new FormData(f).get('caption') || '').trim(); markDirty('photos', p); } closeSheet(); }
  else if (t === 'who') {
    var fd = new FormData(f), nw = String(fd.get('who') || '').trim(), nd = String(fd.get('dog') || '').trim();
    if (!nw) { toast('呼び名を入力してください'); return; }
    who = nw; lsSet(KEY.who, who);
    if (nd !== dogName()) { data.profile = { dogName: nd }; data.profileAt = nowStr(); dirty.profile.profile = data.profileAt; saveLocal(); scheduleSync(); }
    closeSheet();
  }
});
$('#photoFile').addEventListener('change', function (e) { var files = Array.prototype.slice.call(e.target.files || []); e.target.value = ''; if (files.length) uploadPhotos(files); });
$('#sheetWrap').addEventListener('click', function (e) { if (e.target === $('#sheetWrap')) closeSheet(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) { if (ui.date !== today() && false) ui.date = today(); sync(false); } });
window.addEventListener('online', function () { sync(false); });
setInterval(function () { if (!document.hidden && sb && $('#sheetWrap').hidden) sync(false); }, 60000);

/* ================= 起動 ================= */
function boot() {
  connect(); render(false);
  if (!who) openWho();
  if (sb) sync(false);
}
window.addEventListener('load', function () { setTimeout(boot, 50); });
window.__dog = { get data() { return data; }, get dirty() { return dirty; }, sync: sync, ui: ui };
})();
</script>
